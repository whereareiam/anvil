# The proxies in front of the Spigot rows' servers. BungeeCord builds carry no release version, so nothing of it is
# verified and it runs on the Java planning selects.
[velocity]
version = "4.3.1"
build = "45"
java = 25

[bungeecord]
build = "2085"

