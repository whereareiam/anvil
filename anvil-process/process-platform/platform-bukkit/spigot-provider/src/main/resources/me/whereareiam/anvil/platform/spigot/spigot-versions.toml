# Spigot version data exposed by SpigotPlatformProvider.versionData() and read by platform planning.
#
# known:    Minecraft versions GetBukkit publishes Spigot JARs for; Anvil assesses them as COMPATIBLE.
# agent:    the oldest Java the Bukkit agent installed into Spigot runs on. Planning never selects
#           older Java, and the provider's checkAgentJava build task fails when the agent's classes
#           need newer Java.
# verified: Minecraft version -> Java feature versions Anvil's live matrix (CompatibilityScenarioFactory)
#           runs (VERIFIED); every other supported version is listed in `known` only.
# java:     each row applies from `since` until the next row starts. `maximum` is CraftBukkit's
#           startup refusal ("Only up to Java N is supported"). Spigot has no bypass, so planning
#           refuses an explicit request above it.

known = [
	"1.16.5",
	"1.17", "1.17.1",
	"1.18", "1.18.1", "1.18.2",
	"1.19", "1.19.1", "1.19.2", "1.19.3", "1.19.4",
	"1.20.1", "1.20.2", "1.20.4", "1.20.6",
	"1.21", "1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.10", "1.21.11",
	"26.1", "26.1.1", "26.1.2",
]

