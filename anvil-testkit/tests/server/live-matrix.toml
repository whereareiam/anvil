# Anvil's live matrix: every combination listed here runs against real servers, and the version data of the
# platforms and of MCProtocolLib call exactly these combinations verified, which CompatibilityScenarioFactoryTest
# checks in every build. The scenario factory builds the scenarios from this file, and the build registers one
# releaseTest-<minecraft> task per release from it, which CI runs as one job each.

# One direct Paper server per MCProtocolLib release key, oldest first. The release suite runs every player
# capability against it.
