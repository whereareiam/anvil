description = "Walks forward on a stone floor and is teleported relative to where it is, its view turned, mid-walk"
ticks = 60

[join]
x = 0.5
y = 64.0
z = 0.5
yaw = 0.0
pitch = 0.0
chunksAfterTicks = 0

[[blocks]]
from = [-3, 63, -3]
to = [12, 63, 20]
state = "minecraft:stone"

[[keys]]
tick = 5
held = ["forward"]

[[keys]]
tick = 50
held = []

# The server pings during the join's handshake, after the login and right before the first position packet, as an
# anticheat pings before each teleport.
[[server]]
tick = -1
ping = { id = -1 }

# The server pings right before the teleport, as an anticheat does.
[[server]]
tick = 25
ping = { id = -2 }

[[server]]
tick = 25
teleport = { id = 2, x = 3.0, y = 0.0, z = 1.5, yaw = -45.0, pitch = 10.0, relatives = ["x", "y", "z", "yaw", "pitch"] }
