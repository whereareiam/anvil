name: AnvilSystemFixture
version: '${version}'
main: me.whereareiam.anvil.testkit.fixtures.bukkit.AnvilSystemFixturePlugin
api-version: '1.16'
description: Internal behavior fixture for Anvil's live system tests
commands:
  auth:
    description: Exercises kick, reconnect, and observed-identity behavior
    usage: /auth
  anvil-fixture:
    description: Exposes behavior observed by Anvil's simulated player
    usage: /anvil-fixture [ping|gui|item|position|block|entity|kick|transfer]
  anvil-cookie:
    description: Stores a cookie on a player or asks the player for one, from the console
    usage: /anvil-cookie <player> <store <key> <value>|request <key>>
  anvil-entity:
    description: Shows text above a player as an armor stand or a text display, drops a glowing item, or removes an entity, from the console
    usage: /anvil-entity <player> <bubble <text>|display <text>|drop|remove <id>>
  anvil-block:
    description: Tells a player which block it stands on, from the console
    usage: /anvil-block <player> below
  anvil-place:
    description: Teleports a player at the start of the next tick, from the console
    usage: /anvil-place <player> <x> <y> <z> <yaw> <pitch>
