# Block facts that PrismarineJS minecraft-data does not carry, maintained by hand from vanilla's code (Mojang's
# mappings) and merged into the generated block data of every release. A block a release does not have is skipped
# there; a name no release has fails the build. Each [[block]] names the vanilla `source` of its values.
#
# Numbers are Java literals with vanilla's precision: "0.98F" is a float, "0.25D" a double, so a float that vanilla
# widens to a double is widened the same way. Absent values keep vanilla's defaults: friction 0.6F, speed and jump
# factors 1.0F, no bounce, no stuck slowdown, no fluid besides a waterlogged state's water.
#
# Traits: AIR, CLIMBABLE, SLIME_STEP, HONEY_SLIDE, BUBBLE_COLUMN, DYNAMIC_COLLISION, OFFSET_COLLISION, FENCE, WALL,
# FENCE_GATE, TRAPDOOR; the Java BlockTrait enum documents each. property-start gives the lowest value of an integer
# property that does not start at 0, which minecraft-data leaves out for 1.16 and 1.18; releases whose data lists the
# values check it.

[[block]]
names = ["minecraft:air", "minecraft:cave_air", "minecraft:void_air"]
source = "Blocks.AIR, CAVE_AIR and VOID_AIR are AirBlock, whose states are air: BlockBehaviour.Properties.air()"
traits = ["AIR"]

[[block]]
names = ["minecraft:ice", "minecraft:packed_ice", "minecraft:frosted_ice"]
source = "Blocks.ICE, PACKED_ICE and FROSTED_ICE: BlockBehaviour.Properties.friction(0.98F)"
friction = "0.98F"

[[block]]
names = ["minecraft:blue_ice"]
source = "Blocks.BLUE_ICE: BlockBehaviour.Properties.friction(0.989F)"
friction = "0.989F"

[[block]]
names = ["minecraft:slime_block"]
source = """Blocks.SLIME_BLOCK: friction(0.8F); SlimeBlock.bounceUp reverses the fall speed times 1.0D (0.8D for an \
entity that is not living) unless the entity suppresses bouncing; SlimeBlock.stepOn slows a walking entity"""
friction = "0.8F"
bounce = "1.0D"
traits = ["SLIME_STEP"]

[[block]]
