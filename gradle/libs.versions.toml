[versions]

# build tooling
java = "21"
kotlin = "2.4.0"
shadow = "9.6.1"
freefair = "9.5.0"
toolkit = "dev-757d944"

# compile time processing
lombok = "1.18.42"
annotations = "26.1.0"

# general
compress = "1.28.0"
dockerJava = "3.7.1"
jackson = "2.22.2"
slf4j = "2.0.18"
adventure = "5.2.0"

# tooling
## intellij
intellij-platform = "2.18.1"
intellij-idea = "2025.2.5"
intellij-verify = "2026.2.2"

# platform api
paper = "1.21.11-R0.1-SNAPSHOT"
velocity = "3.5.1"
bungeecord = "26.1-R0.1-SNAPSHOT"

# minecraft protocol
mcprotocol = "26.1-SNAPSHOT"
minecraft-auth = "5.0.2"

# testing
junit4 = "4.13.2"
junit = "6.1.3"

[libraries]

# build tooling
lombok-plugin = { group = "io.freefair.gradle", name = "lombok-plugin", version.ref = "freefair" }
shadow = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
toolkit-publish-maven = { group = "me.whereareiam.toolkit", name = "publish-maven", version.ref = "toolkit" }
toolkit-project-discovery = { group = "me.whereareiam.toolkit", name = "project-discovery", version.ref = "toolkit" }
toolkit-architecture = { group = "me.whereareiam.toolkit", name = "architecture", version.ref = "toolkit" }

# compile time processing
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }

# general
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "compress" }
docker-java = { group = "com.github.docker-java", name = "docker-java", version.ref = "dockerJava" }
docker-java-transport-zerodep = { group = "com.github.docker-java", name = "docker-java-transport-zerodep", version.ref = "dockerJava" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-parameters = { group = "com.fasterxml.jackson.module", name = "jackson-module-parameter-names", version.ref = "jackson" }
jackson-toml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-toml", version.ref = "jackson" }
jackson-yaml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jackson" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
adventure-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }

# platform api
paper = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
velocity = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
bungeecord = { group = "net.md-5", name = "bungeecord-api", version.ref = "bungeecord" }

# minecraft protocol
mcprotocol = { group = "org.geysermc.mcprotocollib", name = "protocol", version.ref = "mcprotocol" }
minecraft-auth = { group = "net.raphimc", name = "MinecraftAuth", version.ref = "minecraft-auth" }

# testing
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
junit-vintage = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit" }

[plugins]


# build tooling
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-lombok = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
freefair-lombok = { id = "io.freefair.lombok", version.ref = "freefair" }
toolkit-architecture = { id = "me.whereareiam.toolkit.architecture", version.ref = "toolkit" }
toolkit-project-discovery = { id = "me.whereareiam.toolkit.project-discovery", version.ref = "toolkit" }
toolkit-publish-maven = { id = "me.whereareiam.toolkit.publish.maven", version.ref = "toolkit" }
toolkit-versioning = { id = "me.whereareiam.toolkit.versioning", version.ref = "toolkit" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
