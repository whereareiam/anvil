# CloudburstMC Protocol releases supported by this Anvil version. One release speaks every Bedrock version it has a
# codec for, each with its own protocol number; the worker selects a player's codec by that number.
# Versions use the numbering both CloudburstMC Protocol and Bedrock servers such as Lumi use: Bedrock 26.x is
# written 1.26.x. 'verified' versions are live-tested.
# 'module' is the compile coordinate for version-specific segments. Each [[release.artifact]] is the worker runtime
# closure, downloaded and checked against 'sha256'. Empty pins are filled by
# ./gradlew :anvil-protocol:protocol-cloudburst:pinLibraryReleases, which also refreshes the closure.

