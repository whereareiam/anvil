name: Hand over build outputs
description: >-
  Save the Maven artifacts and Gradle task outputs of the build job, or restore them in a later job of the same
  run. They travel through the Actions cache, so they do not appear among the run's artifacts.

inputs:
  mode:
    description: save in the build job, restore in the jobs that follow it.
    required: true

runs:
  using: composite
  steps:
    - name: Check mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        case "$MODE" in save|restore) ;; *) echo "mode must be save or restore" >&2; exit 1 ;; esac
        mkdir -p "$RUNNER_TEMP/anvil-maven" "$HOME/.gradle/caches/build-cache-1"

    # The attempt keeps a rerun of the build job from colliding with its earlier entry.
    - if: inputs.mode == 'save'
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ runner.temp }}/anvil-maven
          ~/.gradle/caches/build-cache-1
        key: build-outputs-${{ github.run_id }}-${{ github.run_attempt }}

    # A rerun of only this job finds the entry of the attempt that built.
    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ runner.temp }}/anvil-maven
          ~/.gradle/caches/build-cache-1
        key: build-outputs-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: build-outputs-${{ github.run_id }}-
        fail-on-cache-miss: true
