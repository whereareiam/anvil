name: Hand over build outputs
description: Save the Maven artifacts and Gradle task outputs of the build job, or restore them in a later job of the same run.

inputs:
  mode:
    description: save in the build job, restore in the jobs that follow it.
    required: true

runs:
  using: composite
  steps:
    - name: Package build outputs
      if: inputs.mode == 'save'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/build-outputs" "$HOME/.gradle/caches/build-cache-1"
        tar -czf "$RUNNER_TEMP/build-outputs/maven.tar.gz" -C "$RUNNER_TEMP/anvil-maven" .
        tar -czf "$RUNNER_TEMP/build-outputs/task-cache.tar.gz" -C "$HOME/.gradle/caches/build-cache-1" .

    - if: inputs.mode == 'save'
      uses: actions/upload-artifact@v6
      with:
        name: build-outputs
        path: ${{ runner.temp }}/build-outputs/*.tar.gz
        compression-level: 0
        retention-days: 3

    - if: inputs.mode == 'restore'
      uses: actions/download-artifact@v6
      with:
        name: build-outputs
        path: ${{ runner.temp }}/build-outputs

    - name: Unpack build outputs
      if: inputs.mode == 'restore'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.gradle/caches/build-cache-1" "$RUNNER_TEMP/anvil-maven"
        tar -xzf "$RUNNER_TEMP/build-outputs/maven.tar.gz" -C "$RUNNER_TEMP/anvil-maven"
        tar -xzf "$RUNNER_TEMP/build-outputs/task-cache.tar.gz" -C "$HOME/.gradle/caches/build-cache-1"
