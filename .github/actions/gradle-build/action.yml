name: Gradle build
description: Set up Java and Gradle, run a build command, and publish test results.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: "25"
  java-distribution:
    description: Java distribution to install.
    required: false
    default: temurin
  gradle-command:
    description: Gradle command to execute.
    required: true
  test-results-artifact-name:
    description: Artifact name for uploaded test results.
    required: false
    default: Anvil test results
  upload-test-results:
    description: Whether to upload raw test result artifacts.
    required: false
    default: "true"
  use-test-reporter:
    description: Whether to publish a GitHub test report.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        check-latest: true

    - name: Set up Java 21 compiler toolchain
      if: inputs.java-version != '21'
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: ${{ inputs.java-distribution }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build
      shell: bash
      run: |
        command='${{ inputs.gradle-command }}'
        echo "Running: $command"
        eval "$command"

    - name: Upload test results
      if: ${{ always() && inputs.upload-test-results == 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.test-results-artifact-name }}
        path: |
          **/build/test-results/**/*.xml
          **/build/reports/tests/**
        if-no-files-found: ignore

    - name: Test report
      if: ${{ !cancelled() && inputs.use-test-reporter == 'true' && hashFiles('**/build/test-results/**/*.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: dorny/test-reporter@v3
      with:
        name: Anvil Gradle tests
        path: '**/build/test-results/**/*.xml'
        reporter: java-junit
        use-actions-summary: "true"
        list-suites: failed
        list-tests: failed
        fail-on-error: "false"
