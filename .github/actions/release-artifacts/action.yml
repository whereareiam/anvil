name: Restore release verification artifacts
description: Restore the exact Maven-local artifacts and cacheable task outputs from the build job.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v6
      with:
        name: release-verification-artifacts
        path: ${{ runner.temp }}/release-artifacts
    - shell: bash
      run: |
        mkdir -p "$HOME/.gradle/caches/build-cache-1" "$RUNNER_TEMP/anvil-maven"
        tar -xzf "$RUNNER_TEMP/release-artifacts/maven.tar.gz" -C "$RUNNER_TEMP/anvil-maven"
        tar -xzf "$RUNNER_TEMP/release-artifacts/task-cache.tar.gz" -C "$HOME/.gradle/caches/build-cache-1"
