name: Set up the Anvil build
description: >-
  Install the JDKs and Gradle, restore the cache of pinned server distributions, protocol artifacts and JDKs, and
  build the IntelliJ layout index.

inputs:
  cache-shard:
    description: Name of this job's own Anvil cache, so that parallel jobs do not save over each other.
    required: true
  cache:
    description: >-
      Cache policy: auto or read-only. With auto, pushes to the default branch, releases and manual runs write the
      caches and every other run only reads them. A run of code that is not yet reviewed passes read-only.
    required: false
    default: auto

runs:
  using: composite
  steps:
    - name: Decide cache policy
      id: cache
      shell: bash
      env:
        POLICY: ${{ inputs.cache }}
        WRITES: >-
          ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch'
          || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        set -euo pipefail
        case "$POLICY" in
          read-only) echo "read-only=true" >> "$GITHUB_OUTPUT" ;;
          auto) [[ "$WRITES" == "true" ]] && echo "read-only=false" >> "$GITHUB_OUTPUT" || echo "read-only=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "cache must be auto or read-only" >&2; exit 1 ;;
        esac

    # Gradle runs on Java 21; Java 25 is there for the servers and tests that need it.
    - uses: whereareiam/devops/primitive/setup/gradle@v3
      with:
        java-version: "21"
        toolchain-versions: "25"
        cache: ${{ steps.cache.outputs.read-only == 'true' && 'read-only' || 'read-write' }}

    - name: Restore Anvil cache
      if: steps.cache.outputs.read-only == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.anvil/distributions
          ~/.anvil/protocol
          ~/.anvil/jdks
        key: ${{ runner.os }}-anvil-${{ inputs.cache-shard }}-${{ hashFiles('anvil-protocol/**/*-releases.toml', 'anvil-platform/**/*-versions.toml', 'anvil-testkit/**/CompatibilityScenarioFactory.java', 'gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-anvil-${{ inputs.cache-shard }}-
          ${{ runner.os }}-anvil-

    - name: Restore and save Anvil cache
      if: steps.cache.outputs.read-only != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.anvil/distributions
          ~/.anvil/protocol
          ~/.anvil/jdks
        key: ${{ runner.os }}-anvil-${{ inputs.cache-shard }}-${{ hashFiles('anvil-protocol/**/*-releases.toml', 'anvil-platform/**/*-versions.toml', 'anvil-testkit/**/CompatibilityScenarioFactory.java', 'gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-anvil-${{ inputs.cache-shard }}-
          ${{ runner.os }}-anvil-

    # The IntelliJ Platform Gradle Plugin indexes the IDE's jars on first use and can close a jar it is still
    # reading (JetBrains/intellij-platform-gradle-plugin#2192). The scan then drops the Java plugin, saves the
    # incomplete index, and the build fails with "Could not find bundled plugin with ID: 'com.intellij.java'".
    # A complete index is reused, so it is cached and, before the build, built with retries.
    - name: Restore IntelliJ layout index
      if: steps.cache.outputs.read-only == 'true'
      uses: actions/cache/restore@v5
      with:
        path: .intellijPlatform/layoutIndex
        key: ${{ runner.os }}-intellij-layout-${{ hashFiles('gradle/libs.versions.toml') }}

    - name: Restore and save IntelliJ layout index
      if: steps.cache.outputs.read-only != 'true'
      uses: actions/cache@v5
      with:
        path: .intellijPlatform/layoutIndex
        key: ${{ runner.os }}-intellij-layout-${{ hashFiles('gradle/libs.versions.toml') }}

    - name: Index the IntelliJ distribution
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          # Resolving an IntelliJ module's classpath is what reads the index; nothing is compiled.
          if ./gradlew :anvil-integration:integration-intellij:intellij-engine:compileJava --dry-run --no-configuration-cache --quiet; then
            exit 0
          fi
          echo "::warning::The IntelliJ layout index was incomplete on attempt $attempt; rebuilding it"
          rm -rf .intellijPlatform/layoutIndex
        done
        echo "The IntelliJ layout index could not be built" >&2
        exit 1
