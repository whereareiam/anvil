name: Set up Gradle
description: Install Java toolchains and configure Gradle caching.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: "25"
  java-distribution:
    description: Java distribution to install.
    required: false
    default: temurin

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        check-latest: true

    - name: Set up Java 21 compiler toolchain
      if: inputs.java-version != '21'
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: ${{ inputs.java-distribution }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/dev' }}
