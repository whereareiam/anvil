name: Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to verify.
        required: true
        type: string
      version:
        description: Artifact version; defaults to <branch>-<short commit>.
        required: false
        type: string
        default: ""
      packaging:
        description: >-
          Also build the standalone consumers against the published artifacts and hand the build outputs over to the
          jobs that follow.
        required: false
        type: boolean
        default: false
      cache:
        description: Cache policy, auto or read-only. A run of code that is not yet reviewed passes read-only.
        required: false
        type: string
        default: auto
    outputs:
      version:
        description: Artifact version that was verified.
        value: ${{ jobs.build.outputs.version }}
      commit:
        description: Commit that was verified.
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.packaging && 45 || 25 }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve artifact identity
        id: identity
        uses: ./.github/actions/identity
        with:
          version: ${{ inputs.version }}

      - uses: ./.github/actions/setup
        with:
          cache-shard: build
          cache: ${{ inputs.cache }}

      # The server suite applies the Anvil plugin at this build's own version, so the plugin is published first.
      - name: Publish to the run's Maven repository
        env:
          ANVIL_VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          ./gradlew --no-daemon publishToMavenLocal -Panvil.bootstrap -Panvil.intellij=false
          -PanvilVersion="$ANVIL_VERSION"
          -Dmaven.repo.local="$RUNNER_TEMP/anvil-maven"

      # reusable-intellij.yml builds the IntelliJ plugin, so that a failure of its IDE indexing fails only that run.
      - name: Build and test
        env:
          ANVIL_VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          ./gradlew --no-daemon build -Panvil.intellij=false
          -PanvilVersion="$ANVIL_VERSION"
          -Dmaven.repo.local="$RUNNER_TEMP/anvil-maven"

      - name: Build fixtures against the published artifacts
        if: inputs.packaging
        env:
          ANVIL_VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          ./gradlew --no-daemon -p anvil-testkit/fixtures clean build
          -PanvilVersion="$ANVIL_VERSION"
          -Dmaven.repo.local="$RUNNER_TEMP/anvil-maven"

      - name: Build the example against the published artifacts
        if: inputs.packaging
        env:
          ANVIL_VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          ./gradlew --no-daemon -p examples/proof-of-patience build anvilClasses
          -PanvilVersion="$ANVIL_VERSION"
          -Dmaven.repo.local="$RUNNER_TEMP/anvil-maven"

      - uses: whereareiam/devops/primitive/report/junit/publish@v3
        if: always()
        with:
          name: Build test results
          artifact-name: test-results

      - uses: ./.github/actions/build-outputs
        if: inputs.packaging
        with:
          mode: save

  docker:
    name: Docker
    uses: ./.github/workflows/reusable-docker.yml
    with:
      ref: ${{ inputs.ref }}
      cache: ${{ inputs.cache }}
