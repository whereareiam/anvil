name: Release
run-name: "Release ${{ github.event.release.tag_name }}"

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      version: ${{ github.event.release.tag_name }}
      packaging: true

  intellij:
    name: IntelliJ
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-intellij.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      version: ${{ github.event.release.tag_name }}
      packaging: true

  live:
    name: Live
    needs: verify
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-live.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}

  # A release also publishes the IntelliJ plugin, so it waits for the plugin's verification as well.
  publish:
    name: Publish
    needs: [verify, live, intellij]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}
      marketplace: true
    secrets: inherit
