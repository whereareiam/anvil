name: Release
run-name: ${{ (github.event_name == 'release' || inputs.publish) && 'Release publication' || 'Release verification rehearsal' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify, without a leading v
        required: true
        type: string
      publish:
        description: Publish after all verification succeeds (leave disabled for a rehearsal)
        required: true
        type: boolean
        default: false

concurrency:
  group: anvil-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/verify-and-publish.yml
    with:
      version: ${{ github.event.release.tag_name || inputs.version }}
      source_ref: ${{ github.event.release.tag_name || github.sha }}
      publish: ${{ github.event_name == 'release' || inputs.publish }}
