name: Docker engine tests

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to test.
        required: true
        type: string
      cache:
        description: >-
          Cache policy, auto or read-only. With auto, pushes to dev, scheduled runs, releases and manual runs save the
          test image; a run of code that is not yet reviewed passes read-only.
        required: false
        type: string
        default: auto

permissions:
  contents: read
  checks: write

jobs:
  docker:
    name: Docker engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-shard: docker
          cache: ${{ inputs.cache }}

      # gradle.properties names the image once, for the tests and for this cache entry.
      - name: Read the test image
        id: image
        run: echo "reference=$(sed -n 's/^anvil\.docker\.testImage=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      # The image comes from the Actions cache, which docker-cache.yml keeps filled from dev. Only when that entry is
      # missing, a rare case such as right after the image changed, does a run pull it anonymously from its registry.
      - uses: whereareiam/devops/primitive/setup/docker-images@v3
        with:
          images: ${{ steps.image.outputs.reference }}
          cache: ${{ inputs.cache }}

      - name: Run the Docker engine tests
        run: ./gradlew --no-daemon :anvil-environment:execution:execution-docker:dockerTest -Panvil.intellij=false

      - uses: whereareiam/devops/primitive/report/junit/publish@v3
        if: always()
        with:
          name: Docker engine test results
          artifact-name: test-results-docker
