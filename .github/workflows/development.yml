name: Development publication

on:
  workflow_dispatch:

concurrency:
  group: anvil-development-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/verify-and-publish.yml
    with:
      source_ref: ${{ github.sha }}
      publish: true
