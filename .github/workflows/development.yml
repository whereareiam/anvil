name: Development build
run-name: "Development build of ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      live:
        description: Also run the live suites against real servers and proxies
        required: false
        type: boolean
        default: false

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ github.sha }}
      packaging: true
      live: ${{ inputs.live }}

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}
