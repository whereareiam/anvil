name: Live

on:
  workflow_call:
    inputs:
      commit:
        description: Verified commit whose build outputs this run holds.
        required: true
        type: string
      version:
        description: Verified artifact version.
        required: true
        type: string
      cache:
        description: Cache policy, auto or read-only. A run of code that is not yet reviewed passes read-only.
        required: false
        type: string
        default: auto

permissions:
  contents: read
  checks: write

jobs:
  plan:
    name: Plan live suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          sparse-checkout: anvil-testkit/tests/server/live-matrix.toml
          sparse-checkout-cone-mode: false

      # One job per release of the live matrix, which runs the release suite against that release's server, then
      # the platform suite per platform group and the behaviour suite.
      - name: List the suites
        id: suites
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PYTHON'
          import json
          import tomllib

          with open("anvil-testkit/tests/server/live-matrix.toml", "rb") as file:
              releases = [row["minecraft"] for row in tomllib.load(file)["release"]]

          suites = [
              {"name": f"Release {release}", "shard": f"release-{release}", "task": f"releaseTest-{release}", "platforms": ""}
              for release in releases
          ]
          suites += [
              {"name": "Platforms · Spigot and NeoForge", "shard": "platform-direct", "task": "platformTest",
               "platforms": "spigot,neoforge"},
              {"name": "Platforms · Velocity", "shard": "platform-velocity", "task": "platformTest", "platforms": "velocity"},
              {"name": "Platforms · BungeeCord", "shard": "platform-bungeecord", "task": "platformTest",
               "platforms": "bungeecord"},
              {"name": "Sessions, routing and extensions", "shard": "behavior", "task": "behaviorTest", "platforms": ""},
          ]
          print("suites=" + json.dumps(suites))
          PYTHON

  suites:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-shard: ${{ matrix.shard }}
          cache: ${{ inputs.cache }}

      - uses: ./.github/actions/build-outputs
        with:
          mode: restore

      - name: Run live tests
        env:
          ANVIL_VERSION: ${{ inputs.version }}
          TASK: ${{ matrix.task }}
          PLATFORMS: ${{ matrix.platforms }}
        run: >-
          ./gradlew --no-daemon ":anvil-testkit:tests:server:$TASK"
          -Panvil.testMode=full -Panvil.intellij=false
          -PanvilPlatforms="$PLATFORMS"
          -PanvilVersion="$ANVIL_VERSION"
          -Dmaven.repo.local="$RUNNER_TEMP/anvil-maven"

      - uses: whereareiam/devops/primitive/report/junit/publish@v3
        if: always()
        with:
          name: Live test results (${{ matrix.name }})
          artifact-name: test-results-live-${{ matrix.shard }}

  consumer:
    name: Example consumer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-shard: consumer
          cache: ${{ inputs.cache }}

      - uses: ./.github/actions/build-outputs
        with:
          mode: restore

      - name: Run the example's journeys
        env:
          ANVIL_VERSION: ${{ inputs.version }}
        run: >-
          ./gradlew --no-daemon -p examples/proof-of-patience anvilTest
          -PanvilVersion="$ANVIL_VERSION"
          -Dmaven.repo.local="$RUNNER_TEMP/anvil-maven"

      - uses: whereareiam/devops/primitive/report/junit/publish@v3
        if: always()
        with:
          name: Live test results (Example consumer)
          artifact-name: test-results-live-consumer
          results: examples/**/build/test-results/**/*.xml
          reports: examples/**/build/reports/tests/**
