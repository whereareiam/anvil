name: Pull request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: anvil-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ github.sha }}
