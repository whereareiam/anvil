name: Pull request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: anvil-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  approve:
    name: Approve pull request verification
    runs-on: ubuntu-latest
    environment: anvil-pr-live-tests

    steps:
      - name: Approval received
        run: echo "Maintainer approval received; starting pull request verification."

  verify:
    needs: approve
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ github.sha }}
