name: Docker test image
run-name: "Docker test image from ${{ github.ref_name }}"

# Copies the image the Docker execution provider maps temurin:21 to, and the Redis image the container tests run, onto
# the GitHub Container Registry, where the Docker engine tests pull them in CI. It runs when dev changes the reference, weekly and on demand. Only this workflow
# pulls from Docker Hub, about once a week, so its anonymous limit is never reached; if Docker Hub refuses it anyway,
# the copy stays as it is and the next run updates it.
# After the first run, the package's visibility is set to Public once in its settings, so it is free and pulls without
# a login.
on:
  push:
    branches:
      - dev
    paths:
      - gradle.properties
      - .github/workflows/docker-test-image.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: docker-test-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SOURCE: docker.io/library/eclipse-temurin:21-jdk
  CONTAINER_SOURCE: docker.io/library/redis:7.2-alpine

jobs:
  copy:
    name: Copy the test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: gradle.properties
          sparse-checkout-cone-mode: false

      - name: Log in to the GitHub Container Registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # gradle.properties names the copy; imagetools copies every platform of the source without a local pull.
      - name: Copy the image
        run: |
          target="$(sed -n 's/^anvil\.docker\.testImage=//p' gradle.properties)"
          docker buildx imagetools create --tag "$target" "$SOURCE"

      - name: Copy the container image
        run: |
          target="$(sed -n 's/^anvil\.docker\.containerTestImage=//p' gradle.properties)"
          docker buildx imagetools create --tag "$target" "$CONTAINER_SOURCE"
