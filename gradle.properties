anvilVersion=0.0.1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# IntelliJ supplies the Kotlin runtime; Gradle plugins use their Kotlin DSL runtime.
kotlin.stdlib.default.dependency=false

# The image the Docker engine tests run in: a copy of eclipse-temurin:21-jdk, which the Docker execution provider maps
# temurin:21 to, that docker-test-image.yml keeps on the GitHub Container Registry. GitHub-hosted runners share their
# addresses, so anonymous pulls from Docker Hub or Amazon ECR Public hit those registries' limits
# ("toomanyrequests"); CI pulls this copy with its GITHUB_TOKEN instead, which is free and has no such limit.
anvil.docker.testImage=ghcr.io/whereareiam/anvil-test-jdk:21
