anvilVersion=0.0.1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# IntelliJ supplies the Kotlin runtime; Gradle plugins use their Kotlin DSL runtime.
kotlin.stdlib.default.dependency=false

# The image the Docker engine tests run in: a copy of eclipse-temurin:21-jdk, which the Docker execution provider maps
# temurin:21 to, that docker-test-image.yml keeps on the GitHub Container Registry. GitHub-hosted runners share their
# addresses, so anonymous pulls from Docker Hub or Amazon ECR Public hit those registries' limits
# ("toomanyrequests"); CI pulls this copy with its GITHUB_TOKEN instead, which is free and has no such limit.
anvil.docker.testImage=ghcr.io/whereareiam/anvil-test-jdk:21
# The Docker engine tests run this copy of redis:7.2-alpine as a container process.
anvil.docker.containerTestImage=ghcr.io/whereareiam/anvil-test-redis:7.2-alpine

# The shaded workbench JAR is about 24 MB. With Gradle's 30-second default the registry can still be storing it when
# the upload times out, so the retried PUT gets 409 Conflict and the publication fails.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=600000
