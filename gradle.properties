anvilVersion=0.0.1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# IntelliJ supplies the Kotlin runtime; Gradle plugins use their Kotlin DSL runtime.
kotlin.stdlib.default.dependency=false

# The image the Docker engine tests run in, and the reference CI caches it under. CI pulls it anonymously, and
# GitHub-hosted runners share their addresses. Docker Hub limits anonymous pulls per address and six hours, so a run
# that hits the limit can pull again a few hours later. Amazon ECR Public limits anonymous data per address and month,
# which shared runners use up for the rest of the month ("toomanyrequests: Data limit exceeded").
anvil.docker.testImage=eclipse-temurin:21-jdk
